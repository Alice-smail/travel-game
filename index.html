<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>定向旅游小游戏 - 环球港→佘山</title>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            overflow: hidden;
            height: 100vh;
        }

        /* 阶段容器 */
        .stage-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            transition: opacity 0.5s ease;
        }

        .stage-container.hidden {
            opacity: 0;
            pointer-events: none;
            z-index: 0;
        }

        .stage-container.active {
            opacity: 1;
            z-index: 10;
        }

        /* 标题样式 */
        .title {
            color: white;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 40px;
            text-align: center;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        /* 表单样式 */
        .form-container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from {
                transform: translateY(30px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        .form-group select,
        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .form-group select:focus,
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            padding: 8px 15px;
            background: #f5f5f5;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .checkbox-item input {
            margin-right: 5px;
            width: auto;
            cursor: pointer;
        }
        
        .checkbox-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            margin-right: 8px;
        }

        .checkbox-item.selected {
            background: #667eea;
            color: white;
        }

        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        /* 3D游戏地图容器 */
        #game-container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        /* 游戏UI覆盖层 */
        .game-ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
        }

        .game-ui > * {
            pointer-events: auto;
        }

        /* 顶部信息栏 */
        .top-bar {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.95);
            padding: 15px 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }

        .route-info {
            font-size: 14px;
            color: #666;
        }

        .online-users {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            color: #666;
        }

        .online-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4caf50;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* 底部控制栏 */
        .bottom-bar {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .action-btn {
            padding: 12px 25px;
            background: rgba(255, 255, 255, 0.95);
            border: none;
            border-radius: 25px;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: all 0.3s;
        }

        .action-btn:hover {
            background: white;
            transform: translateY(-2px);
        }

        /* 任务面板 */
        .task-panel {
            position: absolute;
            top: 100px;
            right: 20px;
            width: 280px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-height: 60vh;
            overflow-y: auto;
        }

        .task-panel h3 {
            margin-bottom: 15px;
            color: #333;
            font-size: 18px;
        }

        .task-item {
            padding: 12px;
            background: #f5f5f5;
            border-radius: 10px;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .task-item.completed {
            background: #e8f5e9;
            color: #2e7d32;
        }

        /* 互动面板 */
        .interaction-panel {
            position: absolute;
            bottom: 80px;
            left: 20px;
            width: 300px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-height: 200px;
            overflow-y: auto;
        }

        .interaction-panel h3 {
            margin-bottom: 15px;
            color: #333;
            font-size: 16px;
        }

        .message-item {
            padding: 8px 12px;
            background: #f5f5f5;
            border-radius: 8px;
            margin-bottom: 8px;
            font-size: 12px;
        }

        .message-item .user-name {
            font-weight: bold;
            color: #667eea;
        }

        /* 景点信息弹窗 */
        .poi-popup {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            border-radius: 15px;
            padding: 25px;
            max-width: 400px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            z-index: 200;
            display: none;
        }

        .poi-popup.active {
            display: block;
            animation: popIn 0.3s ease;
        }

        @keyframes popIn {
            from {
                transform: translate(-50%, -50%) scale(0.8);
                opacity: 0;
            }
            to {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }
        }

        .poi-popup h3 {
            margin-bottom: 10px;
            color: #333;
        }

        .poi-popup p {
            color: #666;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .poi-popup .close-btn {
            padding: 8px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        /* 协作任务弹窗 */
        .collaboration-task-popup {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 20px;
            padding: 0;
            max-width: 450px;
            width: 90%;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            z-index: 300;
            display: none;
            color: white;
        }

        .collaboration-task-popup.active {
            display: block;
            animation: popIn 0.3s ease;
        }

        .task-popup-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 25px;
            border-bottom: 1px solid rgba(255,255,255,0.2);
        }

        .task-popup-header h3 {
            margin: 0;
            color: white;
            font-size: 20px;
        }

        .task-popup-header .close-btn {
            background: none;
            border: none;
            font-size: 28px;
            color: white;
            cursor: pointer;
            padding: 0;
            width: 30px;
            height: 30px;
            line-height: 30px;
            opacity: 0.8;
        }

        .task-popup-header .close-btn:hover {
            opacity: 1;
        }

        .task-popup-content {
            padding: 25px;
        }

        .task-name {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 15px;
            text-align: center;
        }

        .task-description {
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 20px;
            opacity: 0.95;
            text-align: center;
        }

        .task-reward {
            font-size: 14px;
            background: rgba(255,255,255,0.2);
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
        }

        .task-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .task-btn {
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .accept-btn {
            background: white;
            color: #667eea;
        }

        .accept-btn:hover {
            background: #f0f0f0;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .cancel-btn {
            background: rgba(255,255,255,0.2);
            color: white;
        }

        .cancel-btn:hover {
            background: rgba(255,255,255,0.3);
        }

        /* 路线选择面板 */
        .route-panel {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            border-radius: 15px;
            padding: 25px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            z-index: 200;
            display: none;
        }

        .route-panel.active {
            display: block;
            animation: popIn 0.3s ease;
        }

        .route-panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .route-panel-header h3 {
            margin: 0;
            color: #333;
        }

        .route-panel-header .close-btn {
            background: none;
            border: none;
            font-size: 24px;
            color: #999;
            cursor: pointer;
            padding: 0;
            width: 30px;
            height: 30px;
            line-height: 30px;
        }

        .route-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .route-item {
            display: flex;
            align-items: center;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid transparent;
        }

        .route-item:hover {
            background: #e8e8e8;
            border-color: #667eea;
        }

        .route-color {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            margin-right: 15px;
        }

        .route-info {
            flex: 1;
        }

        .route-name {
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }

        .route-desc {
            font-size: 12px;
            color: #666;
        }

        /* 加载动画 */
        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* 进度条 */
        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255,255,255,0.3);
            border-radius: 3px;
            margin-top: 20px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: white;
            border-radius: 3px;
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>
    <!-- 阶段一：实名认证 -->
    <div class="stage-container active" id="stage1">
        <h1 class="title">🎯 定向旅游小游戏</h1>
        <div class="form-container">
            <h2 style="margin-bottom: 25px; color: #333; text-align: center;">实名认证</h2>
            <form id="authForm">
                <div class="form-group">
                    <label>年龄段</label>
                    <select id="ageGroup" required>
                        <option value="">请选择</option>
                        <option value="child">儿童 (0-12岁)</option>
                        <option value="teen">青少年 (13-17岁)</option>
                        <option value="adult">成人 (18-59岁)</option>
                        <option value="senior">老年 (60岁以上)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>性别</label>
                    <select id="gender" required>
                        <option value="">请选择</option>
                        <option value="male">男</option>
                        <option value="female">女</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>所在城市</label>
                    <input type="text" id="city" placeholder="请输入所在城市" required>
                </div>
                <div class="form-group">
                    <label>游玩偏好标签（可多选）</label>
                    <div class="checkbox-group">
                        <label class="checkbox-item">
                            <input type="checkbox" name="preference" value="亲子">
                            <span>亲子</span>
                        </label>
                        <label class="checkbox-item">
                            <input type="checkbox" name="preference" value="休闲">
                            <span>休闲</span>
                        </label>
                        <label class="checkbox-item">
                            <input type="checkbox" name="preference" value="户外">
                            <span>户外</span>
                        </label>
                        <label class="checkbox-item">
                            <input type="checkbox" name="preference" value="摄影">
                            <span>摄影</span>
                        </label>
                        <label class="checkbox-item">
                            <input type="checkbox" name="preference" value="徒步">
                            <span>徒步</span>
                        </label>
                        <label class="checkbox-item">
                            <input type="checkbox" name="preference" value="探索">
                            <span>探索</span>
                        </label>
                    </div>
                </div>
                <button type="submit" class="btn">下一步：车票认证</button>
            </form>
        </div>
    </div>

    <!-- 阶段二：车票认证 -->
    <div class="stage-container hidden" id="stage2">
        <h1 class="title">🎫 车票认证</h1>
        <div class="form-container">
            <h2 style="margin-bottom: 25px; color: #333; text-align: center;">请填写车票信息</h2>
            <form id="ticketForm">
                <div class="form-group">
                    <label>车次/时间段</label>
                    <select id="trainTime" required>
                        <option value="">请选择</option>
                        <option value="morning">上午 (8:00-12:00)</option>
                        <option value="afternoon">下午 (12:00-18:00)</option>
                        <option value="evening">晚上 (18:00-22:00)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>年龄分类</label>
                    <select id="ageCategory" required>
                        <option value="">请选择</option>
                        <option value="child">儿童</option>
                        <option value="adult">成人</option>
                        <option value="senior">老年</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>目的地分类</label>
                    <select id="destination" required>
                        <option value="">请选择</option>
                        <option value="main">佘山主景区</option>
                        <option value="around">周边景点</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>出行目的</label>
                    <select id="purpose" required>
                        <option value="">请选择</option>
                        <option value="tourism">旅游</option>
                        <option value="family">亲子</option>
                        <option value="leisure">休闲</option>
                        <option value="hiking">徒步探索</option>
                    </select>
                </div>
                <button type="submit" class="btn">进入游戏地图</button>
            </form>
        </div>
    </div>

    <!-- 阶段三：3D游戏地图 -->
    <div class="stage-container hidden" id="stage3">
        <div id="game-container"></div>
        <div class="game-ui">
            <!-- 顶部信息栏 -->
            <div class="top-bar">
                <div class="user-info">
                    <div class="avatar" id="userAvatar">👤</div>
                    <div>
                        <div style="font-weight: bold; color: #333;" id="userName">游客</div>
                        <div class="route-info" id="currentRouteInfo">环球港 → 佘山</div>
                    </div>
                </div>
                <div class="online-users">
                    <div class="online-dot"></div>
                    <span id="onlineCount">0</span> 人在线
                </div>
            </div>

            <!-- 任务面板 -->
            <div class="task-panel">
                <h3>📋 探索任务</h3>
                <div id="taskList"></div>
            </div>

            <!-- 互动面板 -->
            <div class="interaction-panel">
                <h3>💬 同路线动态</h3>
                <div id="messageList"></div>
            </div>

            <!-- 底部控制栏 -->
            <div class="bottom-bar">
                <button class="action-btn" onclick="showRoute()">🗺️ 查看路线</button>
                <button class="action-btn" onclick="sendQuickMessage()">💬 发送消息</button>
                <button class="action-btn" onclick="toggleInteraction(event)">👥 互动模式</button>
                <div style="position: absolute; bottom: 60px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.6); color: white; padding: 8px 15px; border-radius: 20px; font-size: 12px; pointer-events: none; z-index: 101;">
                    提示：点击地面移动角色，靠近其他用户可互动
                </div>
            </div>

            <!-- 景点信息弹窗 -->
            <div class="poi-popup" id="poiPopup">
                <h3 id="poiTitle"></h3>
                <p id="poiDescription"></p>
                <button class="close-btn" onclick="closePoiPopup()">关闭</button>
            </div>

            <!-- 协作任务弹窗 -->
            <div class="collaboration-task-popup" id="collaborationTaskPopup">
                <div class="task-popup-header">
                    <h3>🎯 协作任务</h3>
                    <button class="close-btn" onclick="document.getElementById('collaborationTaskPopup').classList.remove('active')">×</button>
                </div>
                <div class="task-popup-content">
                    <div class="task-name" id="collabTaskName"></div>
                    <div class="task-description" id="collabTaskDesc"></div>
                    <div class="task-reward" id="collabTaskReward"></div>
                    <div class="task-actions">
                        <button class="task-btn accept-btn" onclick="acceptCollaborationTask()">接受任务</button>
                        <button class="task-btn cancel-btn" onclick="document.getElementById('collaborationTaskPopup').classList.remove('active')">稍后再说</button>
                    </div>
                </div>
            </div>

            <!-- 路线选择面板 -->
            <div class="route-panel" id="routePanel">
                <div class="route-panel-header">
                    <h3>🗺️ 选择路线</h3>
                    <button class="close-btn" onclick="document.getElementById('routePanel').classList.remove('active')">×</button>
                </div>
                <div class="route-list">
                    <div class="route-item" onclick="selectRoute(0)">
                        <div class="route-color" style="background: #ff6b6b;"></div>
                        <div class="route-info">
                            <div class="route-name">路线一：经典路线</div>
                            <div class="route-desc">环球港 → 休息站A → 观景台 → 佘山</div>
                        </div>
                    </div>
                    <div class="route-item" onclick="selectRoute(1)">
                        <div class="route-color" style="background: #4ecdc4;"></div>
                        <div class="route-info">
                            <div class="route-name">路线二：舒适路线</div>
                            <div class="route-desc">环球港 → 休息站A → 卫生间A → 休息站B → 佘山</div>
                        </div>
                    </div>
                    <div class="route-item" onclick="selectRoute(2)">
                        <div class="route-color" style="background: #ffd93d;"></div>
                        <div class="route-info">
                            <div class="route-name">路线三：快速路线</div>
                            <div class="route-desc">环球港 → 卫生间B → 佘山</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 全局数据存储
        let userData = {
            auth: {},
            ticket: {},
            preferences: []
        };

        let gameScene = null;
        let camera = null;
        let renderer = null;

        // 初始化3D游戏场景
        function initGame() {
            const container = document.getElementById('game-container');
            
            // 创建场景
            gameScene = new THREE.Scene();
            gameScene.background = new THREE.Color(0x87ceeb); // 天空蓝

            // 创建相机
            camera = new THREE.PerspectiveCamera(
                75,
                window.innerWidth / window.innerHeight,
                0.1,
                1000
            );
            camera.position.set(0, 30, 50);
            camera.lookAt(0, 0, 0);

            // 创建渲染器
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);

            // 添加光源
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            gameScene.add(ambientLight);
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(50, 50, 50);
            gameScene.add(directionalLight);

            // 创建地面
            const groundGeometry = new THREE.PlaneGeometry(200, 200);
            const groundMaterial = new THREE.MeshLambertMaterial({ color: 0x90ee90 });
            const ground = new THREE.Mesh(groundGeometry, groundMaterial);
            ground.rotation.x = -Math.PI / 2;
            ground.position.y = 0;
            gameScene.add(ground);

            // 添加网格辅助线
            const gridHelper = new THREE.GridHelper(200, 20, 0x888888, 0xcccccc);
            gameScene.add(gridHelper);

            // 创建所有POI点
            pois.forEach(poi => {
                createPOI(poi);
            });

            // 创建用户角色
            createUserAvatar();

            // 初始化任务
            initTasks();

            // 创建路线
            createRoute();

            // 更新用户信息显示
            updateUserInfo();

            // 更新路线信息显示
            updateRouteInfo();

            // 初始化任务列表（已在initTasks中初始化）
            updateTaskList();

            // 模拟在线用户
            simulateOnlineUsers();

            // 模拟实时消息
            simulateMessages();

            // 开始渲染循环
            animate();

            // 窗口大小调整
            window.addEventListener('resize', onWindowResize);

            // 鼠标点击交互
            let isMoving = false;
            renderer.domElement.addEventListener('click', (event) => {
                // 如果正在拖动相机，不处理点击
                if (cameraControls.isDragging) {
                    cameraControls.isDragging = false;
                    return;
                }

                const mouse = new THREE.Vector2();
                mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

                const raycaster = new THREE.Raycaster();
                raycaster.setFromCamera(mouse, camera);

                const intersects = raycaster.intersectObjects(gameScene.children, true);
                
                if (intersects.length > 0) {
                    let clickedObject = intersects[0].object;
                    let found = false;
                    
                    // 如果点击的是Group的子对象，找到父Group
                    while (clickedObject && clickedObject.parent && !found) {
                        // 检查是否是其他用户
                        if (clickedObject.userData && clickedObject.userData.type === 'otherUser') {
                            if (interactionMode) {
                                interactWithUser(clickedObject);
                                found = true;
                            }
                            break;
                        }
                        
                        // 检查是否是POI
                        if (clickedObject.userData && clickedObject.userData.type === 'poi') {
                            const poi = clickedObject.userData.poi;
                            document.getElementById('poiTitle').textContent = poi.name;
                            document.getElementById('poiDescription').textContent = poi.description;
                            document.getElementById('poiPopup').classList.add('active');
                            
                            // 检查任务完成 - 改进匹配逻辑
                            checkTaskCompletion(poi);
                            
                            found = true;
                            break;
                        }
                        
                        clickedObject = clickedObject.parent;
                    }
                    
                    // 如果点击的是地面，移动角色
                    if (!found && intersects[0].object.userData && intersects[0].object.userData.type !== 'poi') {
                        const point = intersects[0].point;
                        moveUserTo(point);
                    }
                }
            });

            // 移动用户角色到指定位置
            function moveUserTo(targetPosition) {
                if (!userAvatar || isMoving) return;
                
                isMoving = true;
                const startPosition = userAvatar.position.clone();
                const distance = startPosition.distanceTo(targetPosition);
                const duration = Math.min(distance * 50, 2000); // 最多2秒
                const startTime = Date.now();
                
                function animateMove() {
                    const elapsed = Date.now() - startTime;
                    const progress = Math.min(elapsed / duration, 1);
                    
                    // 使用缓动函数
                    const easeProgress = 1 - Math.pow(1 - progress, 3);
                    
                    userAvatar.position.lerpVectors(startPosition, targetPosition, easeProgress);
                    userAvatar.position.y = 1.5; // 保持高度
                    
                    // 面向移动方向
                    const direction = new THREE.Vector3().subVectors(targetPosition, startPosition).normalize();
                    if (direction.length() > 0.1) {
                        userAvatar.lookAt(userAvatar.position.clone().add(direction));
                    }
                    
                    if (progress < 1) {
                        requestAnimationFrame(animateMove);
                    } else {
                        isMoving = false;
                    }
                }
                
                animateMove();
            }

            // 相机手动控制（鼠标拖动）
            let isMouseDown = false;
            let mouseX = 0;
            let mouseY = 0;

            renderer.domElement.addEventListener('mousedown', (event) => {
                isMouseDown = true;
                mouseX = event.clientX;
                mouseY = event.clientY;
            });

            renderer.domElement.addEventListener('mousemove', (event) => {
                if (!isMouseDown) return;

                const deltaX = event.clientX - mouseX;
                const deltaY = event.clientY - mouseY;

                // 旋转相机
                const spherical = new THREE.Spherical();
                spherical.setFromVector3(camera.position);
                spherical.theta -= deltaX * 0.01;
                spherical.phi += deltaY * 0.01;
                spherical.phi = Math.max(0.1, Math.min(Math.PI - 0.1, spherical.phi));

                camera.position.setFromSpherical(spherical);
                camera.lookAt(0, 0, 0);

                mouseX = event.clientX;
                mouseY = event.clientY;
            });

            renderer.domElement.addEventListener('mouseup', () => {
                isMouseDown = false;
            });

            // 鼠标滚轮缩放
            renderer.domElement.addEventListener('wheel', (event) => {
                event.preventDefault();
                const distance = camera.position.length();
                const newDistance = distance + event.deltaY * 0.1;
                if (newDistance > 10 && newDistance < 200) {
                    camera.position.normalize().multiplyScalar(newDistance);
                }
            });
        }

        // 创建POI（景点）- 根据类型显示不同图标
        function createPOI(poi) {
            const poiGroup = new THREE.Group();
            let color, height;
            
            // 根据类型创建不同的图标
            switch(poi.type) {
                case 'attraction': // 景点 - 塔状结构，带装饰
                    color = 0xff6b6b;
                    height = 6;
                    
                    // 主塔身（渐变圆锥）
                    const towerBase = new THREE.ConeGeometry(2.5, 4, 8);
                    const towerMaterial = new THREE.MeshPhongMaterial({ 
                        color: color,
                        shininess: 100,
                        specular: 0xffffff
                    });
                    const tower = new THREE.Mesh(towerBase, towerMaterial);
                    tower.position.y = 2;
                    poiGroup.add(tower);
                    
                    // 塔顶（小圆锥）
                    const towerTop = new THREE.ConeGeometry(1.5, 2, 8);
                    const topMaterial = new THREE.MeshPhongMaterial({ 
                        color: 0xffd700,
                        shininess: 150,
                        emissive: 0x332200
                    });
                    const top = new THREE.Mesh(towerTop, topMaterial);
                    top.position.y = 5;
                    poiGroup.add(top);
                    
                    // 装饰环
                    for (let i = 0; i < 3; i++) {
                        const ring = new THREE.TorusGeometry(2.2 - i * 0.3, 0.1, 8, 16);
                        const ringMaterial = new THREE.MeshPhongMaterial({ 
                            color: 0xffd700,
                            shininess: 100
                        });
                        const ringMesh = new THREE.Mesh(ring, ringMaterial);
                        ringMesh.rotation.x = Math.PI / 2;
                        ringMesh.position.y = 1 + i * 1.2;
                        poiGroup.add(ringMesh);
                    }
                    
                    // 底部平台
                    const platform = new THREE.CylinderGeometry(3, 3, 0.5, 8);
                    const platformMaterial = new THREE.MeshPhongMaterial({ 
                        color: 0x8b4513,
                        shininess: 50
                    });
                    const platformMesh = new THREE.Mesh(platform, platformMaterial);
                    platformMesh.position.y = 0.25;
                    poiGroup.add(platformMesh);
                    
                    // 发光效果
                    const glowGeometry = new THREE.ConeGeometry(2.8, 4.5, 8);
                    const glowMaterial = new THREE.MeshBasicMaterial({ 
                        color: color,
                        transparent: true,
                        opacity: 0.3
                    });
                    const glow = new THREE.Mesh(glowGeometry, glowMaterial);
                    glow.position.y = 2.2;
                    poiGroup.add(glow);
                    break;
                    
                case 'rest': // 休息站 - 带顶棚的结构
                    color = 0x4ecdc4;
                    height = 4;
                    
                    // 顶棚（圆盘）
                    const roofGeometry = new THREE.CylinderGeometry(2.5, 2.5, 0.3, 16);
                    const roofMaterial = new THREE.MeshPhongMaterial({ 
                        color: 0x2ecc71,
                        shininess: 80
                    });
                    const roof = new THREE.Mesh(roofGeometry, roofMaterial);
                    roof.position.y = 3.5;
                    poiGroup.add(roof);
                    
                    // 支撑柱
                    for (let i = 0; i < 4; i++) {
                        const angle = (i / 4) * Math.PI * 2;
                        const pillarGeometry = new THREE.CylinderGeometry(0.2, 0.2, 3, 8);
                        const pillarMaterial = new THREE.MeshPhongMaterial({ 
                            color: 0x34495e,
                            shininess: 50
                        });
                        const pillar = new THREE.Mesh(pillarGeometry, pillarMaterial);
                        pillar.position.set(
                            Math.cos(angle) * 2,
                            1.5,
                            Math.sin(angle) * 2
                        );
                        poiGroup.add(pillar);
                    }
                    
                    // 中心桌子
                    const tableGeometry = new THREE.CylinderGeometry(1, 1, 0.3, 8);
                    const tableMaterial = new THREE.MeshPhongMaterial({ 
                        color: 0x8b4513,
                        shininess: 30
                    });
                    const table = new THREE.Mesh(tableGeometry, tableMaterial);
                    table.position.y = 0.15;
                    poiGroup.add(table);
                    
                    // 底部平台
                    const restPlatform = new THREE.CylinderGeometry(3, 3, 0.3, 16);
                    const restPlatformMaterial = new THREE.MeshPhongMaterial({ 
                        color: 0x95a5a6,
                        shininess: 20
                    });
                    const restPlatformMesh = new THREE.Mesh(restPlatform, restPlatformMaterial);
                    restPlatformMesh.position.y = 0.15;
                    poiGroup.add(restPlatformMesh);
                    break;
                    
                case 'toilet': // 卫生间 - 带标识的立方体结构
                    color = 0xffd93d;
                    height = 3.5;
                    
                    // 主体建筑（圆角立方体效果）
                    const buildingGeometry = new THREE.BoxGeometry(2.5, 3, 2.5);
                    const buildingMaterial = new THREE.MeshPhongMaterial({ 
                        color: 0xffffff,
                        shininess: 60
                    });
                    const building = new THREE.Mesh(buildingGeometry, buildingMaterial);
                    building.position.y = 1.5;
                    poiGroup.add(building);
                    
                    // 屋顶（三角锥）
                    const toiletRoofGeometry = new THREE.ConeGeometry(1.8, 1, 4);
                    const toiletRoofMaterial = new THREE.MeshPhongMaterial({ 
                        color: 0x3498db,
                        shininess: 80
                    });
                    const toiletRoof = new THREE.Mesh(toiletRoofGeometry, toiletRoofMaterial);
                    toiletRoof.rotation.y = Math.PI / 4;
                    toiletRoof.position.y = 3.5;
                    poiGroup.add(toiletRoof);
                    
                    // 门（深色）
                    const doorGeometry = new THREE.BoxGeometry(0.8, 2, 0.1);
                    const doorMaterial = new THREE.MeshPhongMaterial({ 
                        color: 0x2c3e50,
                        shininess: 30
                    });
                    const door = new THREE.Mesh(doorGeometry, doorMaterial);
                    door.position.set(0, 1, 1.3);
                    poiGroup.add(door);
                    
                    // 标识牌（黄色圆形）
                    const signGeometry = new THREE.CylinderGeometry(0.4, 0.4, 0.1, 16);
                    const signMaterial = new THREE.MeshPhongMaterial({ 
                        color: 0xffd93d,
                        shininess: 100,
                        emissive: 0x332200
                    });
                    const sign = new THREE.Mesh(signGeometry, signMaterial);
                    sign.rotation.x = Math.PI / 2;
                    sign.position.set(1.2, 2.5, 0);
                    poiGroup.add(sign);
                    
                    // 底部平台
                    const toiletPlatform = new THREE.BoxGeometry(3, 0.3, 3);
                    const toiletPlatformMaterial = new THREE.MeshPhongMaterial({ 
                        color: 0x7f8c8d,
                        shininess: 20
                    });
                    const toiletPlatformMesh = new THREE.Mesh(toiletPlatform, toiletPlatformMaterial);
                    toiletPlatformMesh.position.y = 0.15;
                    poiGroup.add(toiletPlatformMesh);
                    break;
                    
                default:
                    color = 0x999999;
                    height = 2.5;
                    const defaultGeometry = new THREE.ConeGeometry(2, 5, 8);
                    const defaultMaterial = new THREE.MeshLambertMaterial({ color: color });
                    const defaultMarker = new THREE.Mesh(defaultGeometry, defaultMaterial);
                    poiGroup.add(defaultMarker);
            }
            
            // 设置位置
            poiGroup.position.set(poi.position[0], poi.position[1], poi.position[2]);
            poiGroup.userData = { poi: poi, type: 'poi' };
            
            // 添加浮动动画
            poiGroup.userData.originalY = height;
            poiGroup.userData.floatSpeed = 0.5 + Math.random() * 0.5;
            poiGroup.userData.floatOffset = Math.random() * Math.PI * 2;
            
            gameScene.add(poiGroup);

            // 添加文字标签（优化版）
            const labelGeometry = new THREE.RingGeometry(3.5, 4, 16);
            const labelMaterial = new THREE.MeshBasicMaterial({ 
                color: color, 
                side: THREE.DoubleSide,
                transparent: true,
                opacity: 0.4
            });
            const label = new THREE.Mesh(labelGeometry, labelMaterial);
            label.rotation.x = -Math.PI / 2;
            label.position.set(poi.position[0], 0.1, poi.position[2]);
            label.userData = { poi: poi, type: 'poi' };
            gameScene.add(label);
            
            // 添加名称标签（使用精灵或文字）
            const textCanvas = document.createElement('canvas');
            const textContext = textCanvas.getContext('2d');
            textCanvas.width = 256;
            textCanvas.height = 64;
            textContext.fillStyle = 'rgba(0, 0, 0, 0.8)';
            textContext.fillRect(0, 0, textCanvas.width, textCanvas.height);
            textContext.fillStyle = 'white';
            textContext.font = 'Bold 32px Arial';
            textContext.textAlign = 'center';
            textContext.textBaseline = 'middle';
            textContext.fillText(poi.name, textCanvas.width / 2, textCanvas.height / 2);
            
            const textTexture = new THREE.CanvasTexture(textCanvas);
            const textMaterial = new THREE.SpriteMaterial({ map: textTexture });
            const textSprite = new THREE.Sprite(textMaterial);
            textSprite.scale.set(8, 2, 1);
            textSprite.position.set(poi.position[0], height + 2, poi.position[2]);
            textSprite.userData = { poi: poi, type: 'poi' };
            gameScene.add(textSprite);
        }

        // 创建用户角色
        function createUserAvatar() {
            const geometry = new THREE.CylinderGeometry(1, 1, 3, 8);
            const material = new THREE.MeshLambertMaterial({ color: 0x667eea });
            userAvatar = new THREE.Mesh(geometry, material);

        // 存储路线对象，用于删除和重新创建
        let routeMeshes = [];

        // 创建路线
        function createRoute() {
            // 清除旧路线
            routeMeshes.forEach(mesh => {
                gameScene.remove(mesh);
            });
            routeMeshes = [];

            // 创建当前选中的路线
            const route = routes[selectedRoute];
            const points = [];
            
            route.pois.forEach(poiIndex => {
                const poi = pois[poiIndex];
                points.push(new THREE.Vector3(poi.position[0], 0.2, poi.position[2]));
            });

            const curve = new THREE.CatmullRomCurve3(points);
            const geometry = new THREE.TubeGeometry(curve, 100, 0.5, 8, false);
            const material = new THREE.MeshLambertMaterial({ color: route.color });
            const routeMesh = new THREE.Mesh(geometry, material);
            routeMesh.userData = { routeIndex: selectedRoute };
            gameScene.add(routeMesh);
            routeMeshes.push(routeMesh);
        }

        // 模拟在线用户

            // 根据用户分类生成模拟在线用户
            const baseCount = Math.floor(Math.random() * 10) + 5;
            let onlineCount = baseCount;
            
            // 根据同路线、同目的地增加在线人数

                onlineCount += Math.floor(Math.random() * 5);
            }

            document.getElementById('onlineCount').textContent = onlineCount;

            // 创建其他用户角色

                setTimeout(() => {
                    createOtherUser(i);
                }, i * 500);
            }
        }

        // 创建其他用户
        function createOtherUser(index) {
            const userGroup = new THREE.Group();
            
            // 身体
            const geometry = new THREE.CylinderGeometry(0.8, 0.8, 2.5, 8);
            const material = new THREE.MeshLambertMaterial({ 
                color: new THREE.Color().setHSL(Math.random(), 0.7, 0.6) 
            });
            const body = new THREE.Mesh(geometry, material);
            body.position.y = 1.25;
            userGroup.add(body);
            
            // 头部
            const headGeometry = new THREE.SphereGeometry(0.6, 8, 8);
            const headMaterial = new THREE.MeshLambertMaterial({ 
                color: new THREE.Color().setHSL(0.1, 0.5, 0.7) 
            });
            const head = new THREE.Mesh(headGeometry, headMaterial);
            head.position.y = 2.5;
            userGroup.add(head);
            
            // 随机位置（在路线上）
            const routePos = pois[Math.floor(Math.random() * pois.length)];
            userGroup.position.set(
                routePos.position[0] + (Math.random() - 0.5) * 10,
                0,
                routePos.position[2] + (Math.random() - 0.5) * 10
            );
            
            // 用户数据
            userGroup.userData = { 
                type: 'otherUser', 
                index: index,
                userName: `用户${index + 1}`,
                hasTask: Math.random() > 0.5, // 50%概率有任务
                taskType: Math.random() > 0.5 ? 'collaboration' : 'info' // 协作任务或信息共享
            };
            
            gameScene.add(userGroup);
            otherUsers.push(userGroup);
            
            // 创建互动提示（初始隐藏）
            createInteractionHint(userGroup);
        }

        // 创建互动提示
        function createInteractionHint(userGroup) {
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            canvas.width = 256;
            canvas.height = 128;
            
            // 绘制提示框
            context.fillStyle = 'rgba(102, 126, 234, 0.9)';
            context.fillRect(0, 0, canvas.width, canvas.height);
            context.fillStyle = 'white';
            context.font = 'Bold 24px Arial';
            context.textAlign = 'center';
            context.textBaseline = 'middle';
            context.fillText('💬 点击互动', canvas.width / 2, canvas.height / 2);
            
            const texture = new THREE.CanvasTexture(canvas);
            const material = new THREE.SpriteMaterial({ 
                map: texture,
                transparent: true,
                opacity: 0
            });
            const sprite = new THREE.Sprite(material);
            sprite.scale.set(6, 3, 1);
            sprite.position.set(0, 3.5, 0);
            sprite.userData = { userGroup: userGroup, visible: false };
            
            userGroup.add(sprite);
            interactionHints.push(sprite);
        }

        // 模拟实时消息
        function simulateMessages() {
            const quickMessages = [
                '大家好！',
                '这里风景真美！',
                '有人一起吗？',
                '快到终点了！',
                '加油！',
                '📸 拍照打卡',
                '👍 点赞',
                '🎉 太棒了！'
            ];

            setInterval(() => {
                if (Math.random() > 0.7) {
                    const message = quickMessages[Math.floor(Math.random() * quickMessages.length)];
                    const userName = `用户${Math.floor(Math.random() * 10) + 1}`;
                    addMessage(userName, message);
                }
            }, 3000);
        }

        // 添加消息
        function addMessage(userName, message) {
            messages.push({ userName, message, time: new Date() });
            if (messages.length > 5) {
                messages.shift();
            }
            updateMessageList();
        }

        // 更新消息列表
        function updateMessageList() {
            const messageList = document.getElementById('messageList');
            messageList.innerHTML = messages.map(msg => `
                <div class="message-item">
                    <span class="user-name">${msg.userName}:</span> ${msg.message}
                </div>
            `).join('');
            messageList.scrollTop = messageList.scrollHeight;
        }

        // 发送快捷消息
        function sendQuickMessage() {
            const messages = ['大家好！', '这里很美！', '一起加油！', '快到终点了！'];
            const message = messages[Math.floor(Math.random() * messages.length)];
            addMessage('我', message);
        }

        // 显示路线选择面板
        function showRoute() {
            const routePanel = document.getElementById('routePanel');
            if (routePanel) {
                routePanel.classList.toggle('active');
            }
        }

        // 选择路线
        function selectRoute(index) {
            selectedRoute = index;
            createRoute();
            initTasks();
            updateTaskList();
            updateRouteInfo();
            document.getElementById('routePanel').classList.remove('active');
        }

        // 更新路线信息显示
        function updateRouteInfo() {
            const route = routes[selectedRoute];
            const routeNames = route.pois.map(poiIndex => pois[poiIndex].name).join(' → ');
            document.getElementById('currentRouteInfo').textContent = routeNames;
        }

        // 切换互动模式
        function toggleInteraction(event) {
            interactionMode = !interactionMode;
            const statusText = interactionMode ? '互动模式已开启！靠近其他用户可触发互动。' : '互动模式已关闭。';
            
            // 更新按钮样式
            const btn = event ? event.target : document.querySelector('.action-btn[onclick*="toggleInteraction"]');
            if (btn) {
                if (interactionMode) {
                    btn.style.background = 'rgba(102, 126, 234, 0.95)';
                    btn.style.color = 'white';
                } else {
                    btn.style.background = 'rgba(255, 255, 255, 0.95)';
                    btn.style.color = '#333';
                }
            }
            
            // 隐藏所有提示
            if (!interactionMode) {
                interactionHints.forEach(hint => {
                    hint.material.opacity = 0;
                    hint.userData.visible = false;
                });
            }
        }

        // 检测附近用户
        function checkNearbyUsers() {
            if (!userAvatar || !interactionMode) return;
            
            nearbyUsers = [];
            const interactionDistance = 8; // 互动距离阈值
            
            otherUsers.forEach(otherUser => {
                const distance = userAvatar.position.distanceTo(otherUser.position);
                if (distance < interactionDistance) {
                    nearbyUsers.push(otherUser);
                    
                    // 显示互动提示
                    const hint = interactionHints.find(h => h.userData.userGroup === otherUser);
                    if (hint && !hint.userData.visible) {
                        hint.material.opacity = 1;
                        hint.userData.visible = true;
                    }
                } else {
                    // 隐藏互动提示
                    const hint = interactionHints.find(h => h.userData.userGroup === otherUser);
                    if (hint && hint.userData.visible) {
                        hint.material.opacity = 0;
                        hint.userData.visible = false;
                    }
                }
            });
        }

        // 与用户互动
        function interactWithUser(userGroup) {
            if (!userGroup || !userGroup.userData) return;
            
            const userData = userGroup.userData;
            
            // 检查是否有协作任务需要完成
            const collaborationTask = tasks.find(t => 
                t.isCollaboration && 
                !t.completed && 
                t.completionType === 'interact' &&
                collaborationTasks.find(ct => ct.userGroupRef === userGroup)
            );
            
            if (collaborationTask) {
                // 完成信息交换任务
                collaborationTask.completed = true;
                updateTaskList();
                addMessage('系统', `🎉 协作任务完成：${collaborationTask.name}！解锁隐藏景点！`);
                return;
            }
            
            if (userData.hasTask) {
                if (userData.taskType === 'collaboration') {
                    // 触发协作任务
                    triggerCollaborationTask(userGroup);
                } else {
                    // 信息共享
                    shareInfo(userGroup);
                }
            } else {
                // 简单打招呼
                const greetings = ['你好！', '一起加油！', '很高兴遇到你！', '一起探索吧！'];
                const greeting = greetings[Math.floor(Math.random() * greetings.length)];
                addMessage(userData.userName, greeting);
            }
        }

        // 触发协作任务
        function triggerCollaborationTask(userGroup) {
            const taskTypes = [
                {
                    name: '协作拍照',
                    description: '与' + userGroup.userData.userName + '一起在景点拍照打卡',
                    reward: '获得双倍经验值'
                },
                {
                    name: '信息交换',
                    description: '与' + userGroup.userData.userName + '交换路线信息',
                    reward: '解锁隐藏景点'
                },
                {
                    name: '共同探索',
                    description: '与' + userGroup.userData.userName + '一起探索新区域',
                    reward: '发现彩蛋奖励'
                }
            ];
            
            const task = taskTypes[Math.floor(Math.random() * taskTypes.length)];
            
            // 保存用户组引用，用于后续互动完成
            task.userGroupRef = userGroup;
            
            // 添加到协作任务列表
            collaborationTasks.push({
                id: Date.now(),
                name: task.name,
                description: task.description,
                reward: task.reward,
                partner: userGroup.userData.userName,
                completed: false,
                userGroupRef: userGroup
            });
            
            // 显示任务弹窗
            showCollaborationTask(task, userGroup.userData.userName);
            
            // 添加到消息
            addMessage('系统', `🎉 触发协作任务：${task.name}！`);
        }

        // 显示协作任务弹窗
        function showCollaborationTask(task, partnerName) {
            const taskPopup = document.getElementById('collaborationTaskPopup');
            document.getElementById('collabTaskName').textContent = task.name;
            document.getElementById('collabTaskDesc').textContent = task.description;
            document.getElementById('collabTaskReward').textContent = '奖励：' + task.reward;
            taskPopup.classList.add('active');
        }

        // 信息共享
        function shareInfo(userGroup) {
            const infoTypes = [
                '前方休息站有免费饮水',
                '观景台现在人不多，适合拍照',
                '卫生间在下一个路口',
                '推荐走路线二，风景更好',
                '终点附近有隐藏景点'
            ];
            
            const info = infoTypes[Math.floor(Math.random() * infoTypes.length)];
            addMessage(userGroup.userData.userName, '💡 ' + info);
            
            // 可能触发新任务
            if (Math.random() > 0.7) {
                const newTask = {
                    id: tasks.length + 1,
                    name: '根据提示探索：' + info.substring(0, 10) + '...',
                    completed: false
                };
                tasks.push(newTask);
                updateTaskList();
                addMessage('系统', '✨ 获得新任务！');
            }
        }

        // 接受协作任务
        function acceptCollaborationTask() {
            const taskPopup = document.getElementById('collaborationTaskPopup');
            const taskName = document.getElementById('collabTaskName').textContent;
            const taskDesc = document.getElementById('collabTaskDesc').textContent;
            
            // 添加到任务列表，保存更多信息用于完成检测
            const newTask = {
                id: Date.now(),
                name: taskName,
                description: taskDesc,
                completed: false,
                isCollaboration: true,
                completionType: getCollaborationTaskType(taskName), // 任务完成类型
                progress: 0 // 任务进度
            };
            tasks.push(newTask);
            updateTaskList();
            
            // 关闭弹窗
            taskPopup.classList.remove('active');
            
            // 提示消息
            addMessage('系统', '✅ 已接受协作任务！完成任务可获得额外奖励。');
            addMessage('系统', '💡 提示：到达相关景点或与其他用户互动可完成任务。');
        }

        // 获取协作任务完成类型
        function getCollaborationTaskType(taskName) {
            if (taskName.includes('拍照')) {
                return 'photo'; // 需要到达景点
            } else if (taskName.includes('信息交换')) {
                return 'interact'; // 需要与其他用户互动
            } else if (taskName.includes('探索')) {
                return 'explore'; // 需要到达新区域
            }
            return 'general';
        }

        // 检查任务完成 - 改进的匹配逻辑
        function checkTaskCompletion(poi) {
            tasks.forEach(task => {
                if (task.completed) return;
                
                // 普通任务匹配
                if (!task.isCollaboration) {
                    // 精确匹配POI名称
                    if (task.name.includes(poi.name)) {
                        task.completed = true;
                        updateTaskList();
                        addMessage('系统', `✅ 完成任务：${task.name}`);
                        return;
                    }
                    
                    // 特殊匹配：佘山相关
                    if ((task.name.includes('佘山') || task.name.includes('终点')) && 
                        (poi.name.includes('佘山') || poi.name.includes('森林公园'))) {
                        task.completed = true;
                        updateTaskList();
                        addMessage('系统', `✅ 完成任务：${task.name}`);
                        return;
                    }
                    
                    // 匹配"前往XXX"格式的任务
                    if (task.name.startsWith('前往') && task.name.includes(poi.name)) {
                        task.completed = true;
                        updateTaskList();
                        addMessage('系统', `✅ 完成任务：${task.name}`);
                        return;
                    }
                } else {
                    // 协作任务完成检测
                    checkCollaborationTaskCompletion(task, poi);
                }
            });
        }

        // 检查协作任务完成
        function checkCollaborationTaskCompletion(task, poi) {
            if (!task.isCollaboration || task.completed) return;
            
            switch(task.completionType) {
                case 'photo':
                    // 拍照任务：到达任意景点即可完成
                    if (poi.type === 'attraction') {
                        task.completed = true;
                        updateTaskList();
                        addMessage('系统', `🎉 协作任务完成：${task.name}！获得额外奖励！`);
                    }
                    break;
                    
                case 'explore':
                    // 探索任务：到达新区域（任意POI）
                    task.progress = (task.progress || 0) + 1;
                    if (task.progress >= 2) { // 需要探索2个地方
                        task.completed = true;
                        updateTaskList();
                        addMessage('系统', `🎉 协作任务完成：${task.name}！发现彩蛋奖励！`);
                    } else {
                        addMessage('系统', `📸 探索进度：${task.progress}/2`);
                    }
                    break;
                    
                case 'interact':
                    // 信息交换任务：需要与其他用户互动（在interactWithUser中处理）
                    break;
                    
                default:
                    // 通用任务：到达任意POI即可
                    task.completed = true;
                    updateTaskList();
                    addMessage('系统', `🎉 协作任务完成：${task.name}！`);
            }
        }

        // 关闭POI弹窗
        function closePoiPopup() {
            document.getElementById('poiPopup').classList.remove('active');
        }

        // 动画循环
        function animate() {
            requestAnimationFrame(animate);

            // 旋转用户角色
            if (userAvatar) {
                userAvatar.rotation.y += 0.01;
            }

            // 其他用户移动动画
            otherUsers.forEach((user, index) => {
                user.rotation.y += 0.005;
                user.position.y = 1.25 + Math.sin(Date.now() / 1000 + index) * 0.2;
            });

            // POI浮动动画
            gameScene.children.forEach(child => {
                if (child.userData && child.userData.type === 'poi' && child.userData.originalY !== undefined) {
                    const time = Date.now() * 0.001;
                    const floatAmount = Math.sin(time * child.userData.floatSpeed + child.userData.floatOffset) * 0.3;
                    child.position.y = child.userData.originalY + floatAmount;
                    
                    // 轻微旋转
                    child.rotation.y += 0.002;
                }
            });

            // 检测附近用户（互动模式）
            if (interactionMode) {
                checkNearbyUsers();
            }

            // 相机不再自动旋转，保持固定视角或手动控制
            // 相机位置固定，可以手动拖动调整
            camera.lookAt(0, 0, 0);

            renderer.render(gameScene, camera);
        }

        // 窗口大小调整
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }


        // 复选框选中效果 - 在DOM加载完成后初始化
        function initCheckboxes() {
            document.querySelectorAll('.checkbox-item').forEach(item => {
                const checkbox = item.querySelector('input[type="checkbox"]');
                
                // 监听checkbox的change事件来更新样式
                checkbox.addEventListener('change', function() {
                    item.classList.toggle('selected', this.checked);
                });
                
                // 初始化选中状态
                if (checkbox.checked) {
                    item.classList.add('selected');
                }
            });
        }
        
        // 页面加载完成后初始化
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initCheckboxes);
        } else {
            initCheckboxes();
        }
    </script>
</body>
</html>
